<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1500px; height: 500px; overflow: hidden; background: #070b14; font-family: Inter, "Segoe UI", sans-serif; }
  .bg { position: absolute; inset: 0; background: url(../../../web/public/media/opening.jpg) center 62% / cover; }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(7,11,20,.15) 0%, rgba(7,11,20,.55) 28%, rgba(7,11,20,.86) 48%, rgba(7,11,20,.9) 100%); }
  .wrap { position: absolute; left: 470px; right: 56px; top: 64px; }
  .kicker { font: 500 13px "JetBrains Mono", monospace; letter-spacing: 5px; color: #e2b467; }
  h1 { font: 400 68px/1 "Instrument Serif", Georgia, serif; color: #f4efe6; margin: 14px 0 12px; letter-spacing: -.5px; }
  h1 i { color: #e2b467; }
  .sub { font-size: 18px; color: #c9cbd3; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px 12px; margin-top: 22px; }
  .card img { width: 100%; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(226,180,103,.35); display: block; }
  .card span { display: block; font-size: 11.5px; color: #d9dbe2; margin-top: 4px; }
  .foot { position: absolute; right: 56px; bottom: 40px; font: 500 17px "JetBrains Mono", monospace; color: #f4efe6; }
  .foot b { color: #e2b467; font-weight: 500; }
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="wrap">
  <div class="kicker">AI BUILDER · ELDAROV AI LABS · LONDON</div>
  <h1>I build AI <i>that does the work.</i></h1>
  <div class="sub">10 AI products shipped end to end: agents, voice and video AI, platforms and games.</div>
  <div class="grid">
    <div class="card"><img src="../../../web/public/media/hermes.jpg"><span>Hermes</span></div>
    <div class="card"><img src="../../../web/public/media/dentalscaner.jpg"><span>Dentalscaner</span></div>
    <div class="card"><img src="../../../web/public/media/modelport.jpg"><span>ModelPort</span></div>
    <div class="card"><img src="../../../web/public/media/moviedirector.jpg"><span>Movie Director</span></div>
    <div class="card"><img src="../../../web/public/media/hivemind.jpg"><span>Hivemind</span></div>
    <div class="card"><img src="../../../web/public/media/receptionist.jpg"><span>Receptionist OS</span></div>
    <div class="card"><img src="../../../web/public/media/freight.jpg"><span>Freight Agent</span></div>
    <div class="card"><img src="../../../web/public/media/brightpath.jpg"><span>Brightpath</span></div>
    <div class="card"><img src="../../../web/public/media/neonrun.jpg"><span>NEON RUN</span></div>
    <div class="card"><img src="../../../web/public/media/hollow-hull.jpg"><span>Hollow Hull</span></div>
  </div>
</div>
<div class="foot"><b>gasanbuildsai</b>.vercel.app</div>
</body></html>
